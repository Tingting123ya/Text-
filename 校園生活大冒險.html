if(r<.4){const a=2+R(8),d=2+R(5),s=[0,1,2,3].map(i=>a+d*i),n=s[3]+d;return{q:`規律：${s.join('、')}、？`,o:[n,n+1,n-1],e:`每次加 ${d}，所以下一個是 ${n}。`}}
if(r<.75){const p=5+R(20),n=2+R(4),t=p*n;return{q:`買 ${n} 個 ${p} 元的麵包，付 100 元，要找多少元？`,o:[100-t,t+1,100-p],e:`先算 ${p}×${n}=${t}，再算 100−${t}=${100-t}。`}}
return{q:'小安比小美高，小美比小華高。誰最矮？',o:['小華','小安','小美'],e:'小安>小美>小華，所以小華最矮。想想看：你是怎麼推出來的？'}}
function quiz(k){const R=a=>a[Math.random()*a.length|0];
if(k=='數學')return ask(mq(),k);

const r=Math.random();
if(r<.45){const e=R(EN);return ask({q:e[0],o:e[1],e:e[2]},k)}
const w=R(LW);
if(r<.8){const o=[w[1],...LW.filter(x=>x!=w).sort(()=>Math.random()-.5).slice(0,2).map(x=>x[1])];return ask({q:'🔊 聽單字，選出中文意思，再大聲跟讀三次。',o,e:w[0]+' = '+w[1]+'。（跟讀無法由瀏覽器評分，請自己對照發音）',sp:w[0]},k)}
sp=w[0];dlg('✏️ 拼字','中文：'+w[1]+'\n提示：'+w[0][0]+' 開頭，共 '+w[0].length+' 個字母',[['🔊 聽發音',()=>spk(w[0],'en-US')]],{id:'spell'});spk(w[0],'en-US')}

function quake(){shake=2500;sf('bad');dlg('⚠️ 地震！（遊戲模擬演練）','畫面劇烈搖晃！你在教室裡，要怎麼做？',[['趴下、掩護（躲到堅固桌下）、穩住（抓住桌腳）',1],['衝去搭電梯下樓',0],['站在窗邊看發生什麼事',0],['慌張地到處亂跑',0]].map(([t,ok])=>[t,()=>{S.st+=ok?5:0;dlg(ok?'👏 正確！':'⚠️ 太危險了',ok?'保護頭頸，等搖晃停止再依指示有秩序疏散。':'警衛叔叔和林阿姨趕來提醒：地震時不能搭電梯、不要靠近窗戶、不要亂跑。正確是趴下、掩護、穩住！',[])}]))}

const d=new Date(S.d0+S.day*864e5),m=d.getMonth()+1,dd=d.getDate(),nm=['你','媽媽','爸爸','Emma'],hit=S.bd.map((b,i)=>b&&b[0]==m&&b[1]==dd?i:-1).filter(i=>i>=0);

function ch(x,y,k,nm){const[X,Y]=P2(x,y);c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(X,Y,9,4,0,0,7);c.fill();
c.fillStyle=k.b;c.fillRect(X-5,Y-9,10,8);c.fillStyle=k.t;c.fillRect(X-6,Y-19,12,11);if(k.a){c.fillStyle=k.a;c.fillRect(X-6,Y-19,12,2)}
c.fillStyle='#ffd8b3';c.fillRect(X-5,Y-29,10,10);c.fillStyle=k.h;c.fillRect(X-6,Y-32,12,5);
if(k.s==1){c.fillRect(X-8,Y-29,3,9);c.fillRect(X+5,Y-29,3,9)}else if(k.s==2){c.fillRect(X-6,Y-29,2,8);c.fillRect(X+4,Y-29,2,8)}
c.fillStyle='#222';c.fillRect(X-3,Y-25,2,2);c.fillRect(X+1,Y-25,2,2);
c.font='10px sans-serif';c.textAlign='center';const w=c.measureText(nm).width+8;c.fillStyle='rgba(20,14,10,.85)';c.fillRect(X-w/2,Y-46,w,13);c.fillStyle='#ffd152';c.fillText(nm,X,Y-36);c.textAlign='left'}
function draw(){const s=SC[room];c.setTransform(1,0,0,1,0,0);c.fillStyle='#0d0907';c.fillRect(0,0,W,H);
if(shake>0)c.translate((Math.random()-.5)*14,(Math.random()-.5)*14);
q([P2(0,0),P2(0,N),P2(0,N,4.5),P2(0,0,4.5)],s.wl[0]);q([P2(0,0),P2(N,0),P2(N,0,4.5),P2(0,0,4.5)],s.wl[1]);
if(s.win)q([P2(6,0,1.5),P2(9,0,1.5),P2(9,0,3.8),P2(6,0,3.8)],'#ffe9b0');
for(let x=0;x<N;x++)for(let y=0;y<N;y++)q([P2(x,y),P2(x+1,y),P2(x+1,y+1),P2(x,y+1)],(x+y)%2?s.fl:sh(s.fl,.9));
if(room=='counsel')q([P2(3,4.5),P2(7,4.5),P2(7,8),P2(3,8)],'#4a6a55');
const L=s.b.map(b=>({d:b[0]+b[2]/2+b[1]+b[3]/2,f:()=>bx(b)}));
NP.filter(g=>g.r==room).forEach(g=>L.push({d:g.x+g.y,f:()=>ch(g.x,g.y,{t:g.c,b:'#34495e',h:g.hr,s:0},g.av+g.nm)}));
const f=FIT[S.fit];L.push({d:pl.x+pl.y,f:()=>ch(pl.x,pl.y,{t:f[0],b:f[1],h:HC[S.hc],s:S.hs,a:f[2]},S.name)});
L.push({d:pt.x+pt.y,f:()=>{const[X,Y]=P2(pt.x,pt.y);c.font='16px serif';c.fillText(PETS[S.pet],X-8,Y)}});
L.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
if(S.t>960){c.fillStyle='rgba(255,130,40,'+Math.min(.25,(S.t-960)/800)+')';c.fillRect(-20,-20,W+40,H+40)}
if(S.wx=='rain'||S.wx=='typhoon'){c.fillStyle='rgba(20,30,50,.25)';c.fillRect(-20,-20,W+40,H+40);c.strokeStyle='rgba(180,210,255,.6)';c.beginPath();const sl=S.wx=='typhoon'?10:4;for(let i=0;i<70;i++){const x=(i*53+F*sl)%W,y=(i*97+F*14)%H;c.moveTo(x,y);c.lineTo(x-sl,y+12)}c.stroke()}}
// ---- 更新 ----
const DV={u:[-1,-1],d:[1,1],l:[-1,1],r:[1,-1]};
function upd(dt){if(dOpen)return;
S.t+=dt/1000*.9;S.en=Math.max(0,S.en-dt*.0004*(S.per==2?.5:1));
if(S.ev&&S.t>=S.ev.t){S.ev=null;quake();return}
if(S.t>=990&&!S.sent.m){S.sent.m=1;return dlg('📱 媽媽的簡訊','「'+S.name+'，放學了！'+(S.wx=='rain'||S.wx=='typhoon'?'外面天氣不好，記得帶傘，':'')+'直接回家，媽媽在家等你。」',[['收到！',cls]])}
if(S.t>=1020){return dlg('🏠 放學回家','今天辛苦了！\n⭐學力星 '+S.st+'　⚡精力 '+Math.round(S.en)+'　💚心情 '+Math.round(S.mo),[['😴 睡覺，進入下一天',newDay]])}
let mx=0,my=0;for(const k in td)if(td[k]){mx+=DV[k][0];my+=DV[k][1]}
if(!mx&&!my&&pl.tx!=null){const dx=pl.tx-pl.x,dy=pl.ty-pl.y,dd=Math.hypot(dx,dy);if(dd>.15){mx=dx/dd;my=dy/dd}else pl.tx=null}
if(mx||my){const l=Math.hypot(mx,my),v=.0032*dt*(S.en<10?.5:1)/l;const nx=pl.x+mx*v,ny=pl.y+my*v;if(!blk(nx,pl.y))pl.x=nx;else pl.tx=null;if(!blk(pl.x,ny))pl.y=ny;else pl.tx=null}
pt.x+=(pl.x-.8-pt.x)*.06;pt.y+=(pl.y+.4-pt.y)*.06;
near=null;let best=1.6;NP.filter(g=>g.r==room).forEach(g=>{const d=Math.hypot(g.x-pl.x,g.y-pl.y);if(d<best){best=d;near=g}
if(d<1.8){return}
if(g.w>0){g.w-=dt;return}
const dx=g.tx-g.x,dy=g.ty-g.y,dd=Math.hypot(dx,dy);
if(dd<.1){g.w=1500+Math.random()*3000;for(let n=0;n<20;n++){g.tx=1+Math.random()*8;g.ty=1+Math.random()*8;if(!blk(g.tx,g.ty))break}}
else{const nx=g.x+dx/dd*.0012*dt*10,ny=g.y+dy/dd*.0012*dt*10;if(blk(nx,ny)){g.w=500;g.tx=g.x;g.ty=g.y}else{g.x=nx;g.y=ny}}});

[['性別','g',['👧 女生','👦 男生']],['髮型','hs',['短髮','雙馬尾','鮑伯']],['髮色','hc',['●焦糖','●黑','●亮金','●紅棕'],HC],['服裝','fit',['英倫水手服','活力體育服','秋季夾克']],['性格','per',['細心同理型（好感度成長快）','自律學霸型（學力星加倍）','活力運動型（體力消耗少）']]].forEach(([l,k,a,col])=>{const lb=document.createElement('label');lb.textContent=l;d.appendChild(lb);d.appendChild(chip(0,a,k,col))});
